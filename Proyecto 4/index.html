<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cafetería Brisa</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            :root {
                --brisa-fondo: #e6f2ec;
                --brisa-verde: #12372f;
                --brisa-menta: #7cc4a6;
                --brisa-ambar: #f2a541;
            }
            body { background: var(--brisa-fondo); }
            .encabezado { background: var(--brisa-verde); color: #fff; }
            .encabezado small { color: var(--brisa-menta); }
            .card-header { background: #fff; color: var(--brisa-verde); }
            .btn-primary { background: var(--brisa-verde); border-color: var(--brisa-verde); }
            .btn-primary:hover { background: #0b241e; border-color: #0b241e; }
            .kpi { border-left: 6px solid var(--brisa-ambar) !important; }
            .kpi .valor { color: var(--brisa-verde); font-size: 1.6rem; font-weight: 700; }
        </style>
    </head>
    <body>

        <div class="encabezado py-4 mb-4">
            <div class="container">
                <h1 class="h3 mb-0">Cafetería Brisa</h1>
                <small>Café de especialidad, té y panadería del día</small>
            </div>
        </div>

        <div class="container">

            <!-- Tarjetas KPI -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card kpi shadow-sm border-0"><div class="card-body">
                        <div class="text-muted small">Producto estrella</div>
                        <div class="valor" id="kpiEstrella">-</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card kpi shadow-sm border-0"><div class="card-body">
                        <div class="text-muted small">Ingresos totales</div>
                        <div class="valor" id="kpiIngresos">$0</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card kpi shadow-sm border-0"><div class="card-body">
                        <div class="text-muted small">Transacciones</div>
                        <div class="valor" id="kpiTransacciones">0</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card kpi shadow-sm border-0"><div class="card-body">
                        <div class="text-muted small">Ticket promedio</div>
                        <div class="valor" id="kpiTicket">$0</div>
                    </div></div>
                </div>
            </div>

            <div class="row g-4">

                <!-- Formulario de Registro -->
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header fw-bold">Registrar producto</div>
                        <div class="card-body">
                            <form id="formProducto">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre del producto</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Moka" required>
                                </div>
                                <div class="mb-3">
                                    <label for="precio" class="form-label">Precio ($)</label>
                                    <input type="number" step="0.5" class="form-control" id="precio" placeholder="45" required>
                                </div>
                                <div class="mb-3">
                                    <label for="cantidad" class="form-label">Cantidad disponible</label>
                                    <input type="number" class="form-control" id="cantidad" placeholder="10" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Guardar producto</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Inventario -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header fw-bold d-flex justify-content-between align-items-center">
                            <span>Menú e inventario</span>
                            <span class="badge bg-secondary" id="totalProductos">0 productos</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Producto</th>
                                            <th>Precio</th>
                                            <th>Cantidad</th>
                                            <th class="text-end" colspan="2">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaProductos">
                                        <!-- Las filas se cargan dinámicamente con JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Gráficas -->
            <div class="row g-4 my-1 pb-5">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header fw-bold">Unidades vendidas por producto</div>
                        <div class="card-body"><canvas id="graficaProductos"></canvas></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header fw-bold">Ingresos por día</div>
                        <div class="card-body"><canvas id="graficaFechas"></canvas></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
